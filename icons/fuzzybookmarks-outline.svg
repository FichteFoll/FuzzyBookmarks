<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- An embedded prefers-color-scheme media query is the documented way to
       make an action icon follow the browser theme (MDN, manifest.json/action).
       `stroke` is inherited, so both paths pick up the root's color. -->
  <style>
    svg {
      stroke: #5b5b66;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        stroke: #fbfbfe;
      }
    }
  </style>
  <path
    d="M24 6h48a6 6 0 0 1 6 6v78L48 66 18 90V12a6 6 0 0 1 6-6z"
    fill="none"
    stroke-width="8"
    stroke-linejoin="round"
  />
  <path
    d="M32 28h32M32 42h22M32 56h27"
    fill="none"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>
