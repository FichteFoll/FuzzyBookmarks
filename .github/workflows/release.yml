name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: verify
    runs-on: ubuntu-latest
    # Requires a human to approve the run before AMO credentials are exposed;
    # the secrets live on this environment, not on the repository.
    environment: amo-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Sign with addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm exec web-ext sign \
            --source-dir dist \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel unlisted \
            --artifacts-dir web-ext-artifacts
      # AMO names the download after the slug it generated for the add-on
      # (e.g. `fc9c7b40cc324d00b457-0.1.0.xpi`) and `web-ext sign` keeps that
      # name, so rename the file to something recognizable in the release.
      - name: Rename the signed package
        run: |
          mv web-ext-artifacts/*.xpi \
            "web-ext-artifacts/fuzzybookmarks-${GITHUB_REF_NAME#v}.xpi"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpi
          path: web-ext-artifacts/*.xpi

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xpi
          path: web-ext-artifacts
      # GitHub ships no maintained first-party release action
      # (actions/create-release is archived),
      # so use the preinstalled GitHub CLI against the Releases API.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v} ($(date -u +%F))" \
            --generate-notes \
            --draft \
            web-ext-artifacts/*.xpi
